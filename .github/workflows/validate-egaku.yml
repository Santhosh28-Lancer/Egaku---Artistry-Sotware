name: Validate Egaku OpenCV Graphite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: OpenCV engine, tests and desktop UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: python -m compileall -q Egaku
      - name: Resolve and install application dependencies
        run: |
          python -m pip install --dry-run -r Egaku/requirements.txt
          python -m pip install -r Egaku/requirements.txt
      - name: Run OpenCV engine tests
        working-directory: Egaku
        run: python -m unittest discover -s tests -v
      - name: Launch desktop window offscreen
        working-directory: Egaku
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from main import EgakuWindow
          app = QApplication([])
          window = EgakuWindow()
          assert window.windowTitle() == "Egaku — Image to Art Studio"
          assert hasattr(window, "depth") and hasattr(window, "detail")
          assert not hasattr(window, "model_value")
          window.close()
          print("Egaku desktop UI smoke test passed.")
          PY
      - name: Verify required project files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "Egaku/main.py",
              "Egaku/egaku/sketch_engine.py",
              "Egaku/requirements.txt",
              "Egaku/setup.bat",
              "Egaku/setup_gpu.bat",
              "Egaku/run.bat",
              "Egaku/tests/test_engine_helpers.py",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("Missing project files: " + ", ".join(missing))
          print("All required Egaku project files are present.")
          PY
